<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Loop Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-animations">.glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-gradient-purple {
            background: linear-gradient(to right, #d8b4fe, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nebula-center {
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, rgba(76, 29, 149, 0.1) 50%, transparent 80%);
            filter: blur(40px);
        }
        .glow-green-halo { 
            background: rgba(34, 197, 94, 0.2);
            box-shadow: 0 0 40px 10px rgba(34, 197, 94, 0.3);
        }
        .glow-pink-halo {
            background: rgba(236, 72, 153, 0.2);
            box-shadow: 0 0 40px 10px rgba(236, 72, 153, 0.3);
        }
        .glow-gray-halo {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.15);
        }
        
        .orbit-line-static {
            position: absolute;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(-15deg);
        }

        @keyframes orbitAndAbsorb {
            0% {
                transform: rotate(0deg) translateX(140px) rotate(0deg) scale(0);
                opacity: 0;
            }
            5% {
                opacity: 1;
                transform: rotate(0deg) translateX(140px) rotate(0deg) scale(1);
            }
            60% {
                transform: rotate(360deg) translateX(140px) rotate(-360deg) scale(1);
                opacity: 1;
            }
            90% {
                transform: rotate(720deg) translateX(0px) rotate(-720deg) scale(0);
                opacity: 0;
            }
            100% {
                transform: rotate(720deg) translateX(0px) rotate(-720deg) scale(0);
                opacity: 0;
            }
        }

        .animate-whatsapp {
            animation: orbitAndAbsorb 30s linear infinite;
            animation-delay: 0s;
        }

        .animate-instagram {
            animation: orbitAndAbsorb 30s linear infinite;
            animation-delay: 10s;
        }

        .animate-groups {
            animation: orbitAndAbsorb 30s linear infinite;
            animation-delay: 20s;
        }

        .galaxy-swirl {
            background: radial-gradient(ellipse at center, rgba(167, 139, 250, 0.3) 0%, rgba(139, 92, 246, 0.1) 40%, transparent 70%);
            transform: rotate(-25deg);
        }</style>
<style data-purpose="background-styles">
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0a1f;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        .main-bg {
            background: radial-gradient(circle at 50% 40%, #1a154d 0%, #0b0a1f 80%);
            position: relative;
        }
    </style>
</head>
<body class="flex items-center justify-center">
<!-- BEGIN: Mobile Container -->
<main class="main-bg relative w-full max-w-[430px] h-full max-h-[932px] overflow-hidden flex flex-col px-8 py-12 shadow-2xl">
<!-- BEGIN: Status Bar -->
<header class="flex justify-between items-center w-full absolute top-0 left-0 px-8 py-4 z-50">
<div class="text-sm font-semibold"></div>
<div class="flex gap-1.5 items-end">

</header>
<!-- END: Status Bar -->
<!-- BEGIN: Top Content -->
<section class="mt-8 text-center z-20" data-purpose="branding-section">
<div class="flex justify-center mb-6">
<div class="w-16 h-16 border-2 border-white/80 rounded-full flex items-center justify-center p-2">
<svg class="text-white w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14.5c-1.5-1.5-1.5-3 0-3s1.5 1.5 0 3z"></path>
</svg>
</div>
</div>
<h1 class="text-4xl font-bold mb-3 tracking-tight">
                Entra a tu <span class="text-gradient-purple">loop</span>
</h1>
<p class="text-gray-400 text-sm leading-relaxed">
                Grupos reales.<br>
                Conversaciones seguras.
            </p>
</section>
<!-- END: Top Content -->
<!-- BEGIN: Central Graphic with Path Animations -->
<section class="flex-grow relative flex items-center justify-center z-10" data-purpose="orbital-elements">
<!-- Background Glows -->
<div class="absolute w-[300px] h-[150px] galaxy-swirl rounded-[100%] opacity-60"></div>
<div class="absolute w-48 h-48 nebula-center rounded-full"></div>
<!-- Static Orbit Lines -->
<div class="orbit-line-static w-[340px] h-[200px] opacity-20"></div>
<!-- Light points/Stars -->
<div class="absolute top-[38%] left-[18%] w-1.5 h-1.5 bg-green-400 rounded-full shadow-[0_0_8px_#4ade80]"></div>
<div class="absolute bottom-[40%] right-[28%] w-1 h-1 bg-purple-300 rounded-full shadow-[0_0_8px_#d8b4fe]"></div>
<div class="absolute bottom-[28%] left-[42%] w-1 h-1 bg-blue-300 rounded-full opacity-60"></div>
<div class="absolute top-[45%] right-[22%] w-1 h-1 bg-white rounded-full opacity-40"></div>
<!-- WhatsApp Icon & Label -->
<div class="absolute flex items-center animate-whatsapp opacity-0">
<div class="relative flex items-center">
<div class="w-14 h-14 rounded-full glow-green-halo flex items-center justify-center z-10">
<div class="w-10 h-10 rounded-full bg-[#25D366] flex items-center justify-center">
<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">

</svg>
</div>
</div>
<div class="glass-morphism -ml-4 pl-8 pr-5 py-2.5 rounded-full text-xs font-semibold tracking-wide">
                        WhatsApp
                    </div>
</div>
</div>
<!-- Instagram Icon & Label -->
<div class="absolute flex items-center animate-instagram opacity-0">
<div class="relative flex items-center">
<div class="w-14 h-14 rounded-full glow-pink-halo flex items-center justify-center z-10">
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] flex items-center justify-center">
<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">

</svg>
</div>
</div>
<div class="glass-morphism -ml-4 pl-8 pr-5 py-2.5 rounded-full text-xs font-semibold tracking-wide">
                        Instagram
                    </div>
</div>
</div>
<!-- Grupos Icon & Label -->
<div class="absolute flex items-center animate-groups opacity-0">
<div class="relative flex items-center">
<div class="w-14 h-14 rounded-full glow-gray-halo flex items-center justify-center z-10">
<div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/20">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<div class="glass-morphism -ml-4 pl-8 pr-8 py-2.5 rounded-full text-xs font-semibold tracking-wide">
                        Grupos
                    </div>
</div>
</div>
</section>
<!-- END: Central Graphic -->
<!-- BEGIN: Bottom Actions -->
<footer class="mt-auto flex flex-col gap-4 z-20" data-purpose="onboarding-actions">
<button id="explore-button" onclick="if(window.VibeLoop && window.VibeLoop.postMessage) { window.VibeLoop.postMessage('explore'); }" class="w-full bg-transparent hover:bg-white/5 text-white h-14 rounded-3xl font-bold border border-white/20 flex items-center justify-center relative transition-transform active:scale-[0.98]">
<span class="">Explorar</span>
<svg class="w-5 h-5 absolute right-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
<!-- Legal Text -->
<p class="mt-4 text-[11px] text-center text-indigo-200/60 px-4 leading-normal">
                Al continuar, aceptas nuestras <br>
                <span class="text-indigo-300 font-medium cursor-pointer" onclick="if(window.VibeLoop && window.VibeLoop.postMessage) { window.VibeLoop.postMessage('terms'); }">Condiciones</span> y 
                <span class="text-indigo-300 font-medium cursor-pointer" onclick="if(window.VibeLoop && window.VibeLoop.postMessage) { window.VibeLoop.postMessage('privacy'); }">Política de privacidad</span>.
</p>
<!-- Home Indicator (iOS style) -->

</footer>
<!-- END: Bottom Actions -->
</main>
<!-- END: Mobile Container -->


</body></html>
