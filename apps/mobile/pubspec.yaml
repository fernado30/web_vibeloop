name: vibeloop_mobile
description: VIBELOOP mobile app
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  supabase_flutter: ^2.5.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_mobile_ads: ^8.0.0
  flutter_svg: ^2.0.17
  webview_flutter: ^4.10.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/vibeloop_icon.png
  adaptive_icon_background: "#0A84FF"
  adaptive_icon_foreground: assets/icon/vibeloop_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/web.env
    - assets/app_icon.png
    - assets/icon/
    - assets/icons/
    - assets/stitch/
    - assets/legal/
