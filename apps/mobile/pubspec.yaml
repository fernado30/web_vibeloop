name: Nadie_mobile
description: nadie mobile app
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_mobile_ads: ^8.0.0
  flutter_svg: ^2.0.17
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^17.2.3
  package_info_plus: ^10.2.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  app_links: ^7.0.0
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/nadie_app_icon.png
  adaptive_icon_background: "#06020D"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/web.env
    - assets/app_icon.png
    - assets/icon/
    - assets/icons/
    - assets/stitch/
    - assets/legal/
