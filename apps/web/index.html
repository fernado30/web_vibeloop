<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIBELOOP Anonymous</title>
    <meta
      name="description"
      content="Web de mensajes anónimos para grupos VIBELOOP."
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div id="status" class="status">Cargando buzón anónimo...</div>

        <div id="inboxView" class="inbox hidden">
          <header class="hero">
            <div class="avatar" aria-hidden="true">?</div>
            <div class="hero-copy">
              <p class="eyebrow">Mensajes anónimos</p>
              <h1 id="groupName">Mándame mensajes anónimos</h1>
              <p id="groupDescription" class="subtitle"></p>
            </div>
          </header>

          <form id="messageForm" class="composer">
            <label class="sr-only" for="messageInput">Mensaje anónimo</label>
            <textarea
              id="messageInput"
              class="message-input"
              maxlength="500"
              placeholder="¿Qué quieres decir?"
            ></textarea>

            <div class="composer-footer">
              <span id="charCount" class="counter">0/500</span>
              <button id="sendButton" class="primary" type="submit">¡Enviar!</button>
            </div>
          </form>

          <p id="feedback" class="feedback hidden"></p>

          <div class="prompts">
            <span>🔒 mensajes anónimos para el grupo</span>
            <span>✨ sin login, sin nombre y sin perfil</span>
          </div>
        </div>

        <div id="errorView" class="error hidden"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
