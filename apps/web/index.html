<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIBELOOP Web</title>
    <meta
      name="description"
      content="Web invitation experience for VIBELOOP groups."
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="badge">VIBELOOP WEB</div>
        <h1>Invitación para abrir el grupo en la app móvil.</h1>
        <p class="lede">
          Sube tu foto y pulsa acceder para abrir el chat del grupo en la app móvil.
        </p>
      </section>

      <section class="card">
        <div id="status" class="status">Cargando invitación...</div>

        <div id="inviteView" class="invite hidden">
          <p class="eyebrow">Invitación</p>
          <h2 id="groupName">Grupo</h2>
          <p id="groupDescription" class="description"></p>

          <div class="meta">
            <span id="memberCount"></span>
            <span id="createdAt"></span>
          </div>

          <div class="photo-block">
            <label for="photo">Tu foto</label>
            <input id="photo" type="file" accept="image/*" />
            <div id="preview" class="preview hidden"></div>
          </div>

          <button id="joinButton" class="primary">Acceder al grupo</button>
          <p id="hint" class="hint">
            Sube tu foto y pulsa acceder para abrir el chat en la app móvil.
          </p>
        </div>

        <div id="errorView" class="error hidden"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
